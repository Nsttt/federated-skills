name: Deploy tools

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Or set "packageManager" in package.json and drop `version`.
      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Needs a committed pnpm-lock.yaml (see the README).
      - run: pnpm install --frozen-lockfile

      # The @module-federation/mcp/rslib preset bundles tools/*.ts, checks the
      # repo and writes the provider artifact to dist/. It fails on any error.
      - run: pnpm build

      - name: Deploy
        env:
          ZE_CI_TOKEN: ${{ secrets.ZE_CI_TOKEN }}
        run: npx zephyr-cli@latest deploy dist
